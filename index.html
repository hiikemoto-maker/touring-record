  function updateSyncStatus(text = '') {
    const el = document.getElementById('sync-status');
    if (!el) return;
    if (text) {
      el.textContent = text;
      updateBackupHealth();
      return;
    }
    const { apiUrl, syncKey } = getSyncSettings();
    el.textContent = apiUrl && syncKey ? (getSyncPendingStamp() ? '同期待ち' : '設定済み') : '未設定';
    updateBackupHealth();
  }

  function formatDateTimeShort(value) {
    const time = Number(value || 0);
    if (!time) return '未実行';
    const date = new Date(time);
    if (Number.isNaN(date.getTime())) return '未実行';
    return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
  }

  function updateBackupHealth() {
    const el = document.getElementById('backup-health');
    if (!el) return;
    const { apiUrl, syncKey } = getSyncSettings();
    const pending = getSyncPendingStamp();
    const records = getRecords().length;
    const maintenance = getMaintenance().length;
    const lastExport = Number(getStoredValue(LAST_EXPORT_STORAGE) || 0);
    const lastImport = Number(getStoredValue(LAST_IMPORT_STORAGE) || 0);
    let level = 'warn';
    let lead = '書き出し推奨';
    if (apiUrl && syncKey && !pending) {
      level = 'good';
      lead = '同期設定済み';
    } else if (pending) {
      level = navigator.onLine ? 'warn' : 'danger';
      lead = navigator.onLine ? '未同期あり' : 'オフライン同期待ち';
    }
    el.className = `sync-health ${level}`;
    el.textContent = `${lead} / 記録${records}件・メンテ${maintenance}件 / 最終書き出し ${formatDateTimeShort(lastExport)} / 最終読み込み ${formatDateTimeShort(lastImport)}`;
    updateStorageMeter();
  }

  async function updateStorageMeter() {
    const el = document.getElementById('storage-meter');
    if (!el) return;
    try {
      const storageEstimate = navigator.storage && navigator.storage.estimate
        ? await navigator.storage.estimate()
        : {};
      const { usage = 0, quota = 0 } = storageEstimate;
      const localBytes = estimateAppLocalStorageBytes();
      const inlinePhotos = estimateInlinePhotoStats();
      const photoStats = await estimatePhotoStoreStats();
      const activePhotoBytes = inlinePhotos.bytes + photoStats.usedBytes;
      const activePhotoCount = inlinePhotos.count + photoStats.usedCount;
      const pct = quota ? Math.min(100, Math.round((usage / quota) * 100)) : 0;
      let level = 'good';
      if (pct >= 90) level = 'danger';
      else if (pct >= 75 || photoStats.unusedBytes > 0) level = 'warn';
      const totalText = quota
        ? ` / ブラウザ総使用量 ${formatBytes(usage)} / 上限 ${formatBytes(quota)}（${pct}%・アプリ本体キャッシュ含む）`
        : '';
      const unusedText = photoStats.unusedCount
        ? ` / 未使用写真 ${photoStats.unusedCount}枚 ${formatBytes(photoStats.unusedBytes)}`
        : '';
      el.className = `sync-health ${level}`;
      el.textContent = `💾 写真 ${activePhotoCount}枚 ${formatBytes(activePhotoBytes)} / 記録データ ${formatBytes(localBytes)}${totalText}${unusedText}`;
    } catch {
      el.className = 'sync-health warn';
      el.textContent = '💾 保存容量を確認できませんでした';
    }
  }

  function formatBytes(bytes) {
    const size = Math.max(0, Number(bytes) || 0);
    if (size >= 1024 * 1024) return `${(size / (1024 * 1024)).toFixed(1)}MB`;
    if (size >= 1024) return `${Math.round(size / 1024)}KB`;
    return `${Math.round(size)}B`;
  }

  function textBytes(text) {
    return new Blob([String(text || '')]).size;
  }

  function estimateAppLocalStorageBytes() {
    try {
      if (!window.localStorage) return 0;
      let total = 0;
      for (let i = 0; i < localStorage.length; i += 1) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith('touring_')) continue;
        total += textBytes(key) + textBytes(localStorage.getItem(key) || '');
      }
      return total;
    } catch {
      return 0;
    }
  }

  function collectRecordPhotos(records = getRecords()) {
    const refs = new Set();
    const inline = [];
    const add = photo => {
      if (isPhotoRef(photo)) refs.add(photo);
      else if (isSafeImageSrc(photo)) inline.push(photo);
    };
    (records || []).forEach(record => {
      if (Array.isArray(record.photos)) record.photos.forEach(add);
      normalizeStops(record.stops).forEach(stop => {
        if (Array.isArray(stop.photos)) stop.photos.forEach(add);
      });
    });
    return { refs, inline };
  }

  function estimateInlinePhotoStats() {
    const { inline } = collectRecordPhotos();
    return {
      count: inline.length,
      bytes: inline.reduce((sum, photo) => sum + textBytes(photo), 0)
    };
  }

  async function estimatePhotoStoreStats() {
    const empty = { usedCount: 0, usedBytes: 0, unusedCount: 0, unusedBytes: 0 };
    if (!window.indexedDB) return empty;
    try {
      const { refs } = collectRecordPhotos();
      const photos = await idbGetAllPhotos();
      return photos.reduce((stats, item) => {
        const ref = PHOTO_REF_PREFIX + item.id;
        const bytes = textBytes(item.data);
        if (refs.has(ref)) {
          stats.usedCount += 1;
          stats.usedBytes += bytes;
        } else {
          stats.unusedCount += 1;
          stats.unusedBytes += bytes;
        }
        return stats;
      }, { ...empty });
    } catch {
      return empty;
    }
  }

  function updateAppVersionStatus(text = '') {
    const el = document.getElementById('app-update-status');
    if (!el) return;
    el.textContent = text || `アプリ版 ${APP_VERSION}`;
  }

  async function refreshAppShell() {
    updateAppVersionStatus('キャッシュを更新中…');
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg => reg.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      }
      const url = new URL(location.href);
      url.searchParams.set('v', Date.now());
      location.replace(url.toString());
    } catch (e) {
      updateAppVersionStatus('更新確認に失敗しました');
      showError(e.message || '更新確認に失敗しました');
    }
  }

  function ensureRecordUpdatedAt(record, fallbackTime) {
    const updatedAt = Number(record.updatedAt);
    return {
      ...record,
      updatedAt: Number.isFinite(updatedAt) && updatedAt > 0 ? updatedAt : fallbackTime
    };
  }

  function prepareLocalRecordsForSync() {
    const now = Date.now();
    const records = getRecords().map(r => ensureRecordUpdatedAt(r, now));
    saveRecords(records);
    return records;
  }

  function ensureMaintenanceUpdatedAt(item, fallbackTime) {
    const id = String(item?.id || `m${fallbackTime}${Math.floor(Math.random() * 100000)}`);
    const updatedAt = Number(item?.updatedAt || item?.createdAt);
    const createdAt = Number(item?.createdAt);
    return {
      ...item,
      id,
      createdAt: Number.isFinite(createdAt) && createdAt > 0 ? createdAt : fallbackTime,
      updatedAt: Number.isFinite(updatedAt) && updatedAt > 0 ? updatedAt : fallbackTime
    };
  }

  function prepareLocalMaintenanceForSync() {
    const now = Date.now();
    const items = getMaintenance()
      .filter(item => item && typeof item === 'object' && normalizeDateValue(item.date))
      .map(item => ensureMaintenanceUpdatedAt(item, now));
    saveMaintenance(items);
    return items;
  }

  function prepareRecordForCloud(record) {
    const safe = { ...record };
    const photos = Array.isArray(record.photos) ? record.photos : [];
    safe.photos = [];
    safe.photoCount = photos.length;
    safe.stops = stripStopPhotosForCloud(record.stops);
    return safe;
  }

  function stripStopPhotosForCloud(stops) {
    return (stops || []).map(stop => {
      if (!stop || typeof stop !== 'object') return stop;
      const photos = Array.isArray(stop.photos) ? stop.photos : [];
      return {
        ...stop,
        photos: [],
        photoCount: photos.length
      };
    });
  }

  function mergeStopsPreservingLocalPhotos(remoteStops, localStops) {
    if (!Array.isArray(remoteStops)) return remoteStops;
    const localList = Array.isArray(localStops) ? localStops : [];
    return remoteStops.map((stop, index) => {
      if (!stop || typeof stop !== 'object') return stop;
      const remotePhotos = Array.isArray(stop.photos) ? stop.photos : [];
      const remoteInlinePhotos = remotePhotos.filter(isSafeImageSrc);
      if (remoteInlinePhotos.length) return { ...stop, photos: remoteInlinePhotos };
      const local = localList[index];
      const localPhotos = Array.isArray(local?.photos) ? local.photos.filter(isStorablePhoto) : [];
      return localPhotos.length ? { ...stop, photos: localPhotos } : stop;
    });
  }

  function maintenanceSyncRecordId(id) {
    return `${MAINT_SYNC_RECORD_PREFIX}${id}`;
  }

  function isMaintenanceSyncRecordId(id) {
    return String(id || '').startsWith(MAINT_SYNC_RECORD_PREFIX);
  }

  function stripMaintenanceSyncRecordId(id) {
    const value = String(id || '');
    return isMaintenanceSyncRecordId(value) ? value.slice(MAINT_SYNC_RECORD_PREFIX.length) : value;
  }

  function isMaintenanceSyncRecord(record) {
    return record && (record.syncType === 'maintenance' || isMaintenanceSyncRecordId(record.id));
  }

  function prepareMaintenanceRecordForCloud(item) {
    return {
      ...item,
      id: maintenanceSyncRecordId(item.id),
      syncType: 'maintenance',
      photos: [],
      photoCount: 0
    };
  }

  function maintenanceFromSyncRecord(record) {
    const { syncType, photos, photoCount, ...item } = record || {};
    return {
      ...item,
      id: stripMaintenanceSyncRecordId(item.id)
    };
  }

  function splitMaintenanceSyncRecords(records) {
    const normalRecords = [];
    const maintenance = [];
    (records || []).forEach(record => {
      if (isMaintenanceSyncRecord(record)) {
        maintenance.push(maintenanceFromSyncRecord(record));
      } else {
        normalRecords.push(record);
      }
    });
    return { records: normalRecords, maintenance };
  }

  function splitMaintenanceSyncDeletes(deletedRecords) {
    const normalDeleted = [];
    const deletedMaintenance = [];
    (deletedRecords || []).forEach(item => {
      const id = String(item?.id || item?.recordId || '');
      if (!id) return;
      const deletedAt = item.deletedAt || item.deleted_at;
      if (isMaintenanceSyncRecordId(id)) {
        deletedMaintenance.push({ id: stripMaintenanceSyncRecordId(id), deletedAt });
      } else {
        normalDeleted.push(item);
      }
    });
    return { records: normalDeleted, maintenance: deletedMaintenance };
  }

  function isLegacyRecord(record) {
    return record && !Array.isArray(record.distances);
  }

  function clearLegacyRecords() {
    const records = getRecords();
    const legacyRecords = records.filter(isLegacyRecord);
    if (!legacyRecords.length) {
      showToast('旧記録はありません');
      return;
    }
    if (!confirm(`旧形式の記録 ${legacyRecords.length}件を削除しますか？`)) return;
    legacyRecords.forEach(record => rememberDeletedRecord(record.id));
    saveRecords(records.filter(record => !isLegacyRecord(record)));
    renderList();
    queueAutoSync();
    showToast(`旧記録 ${legacyRecords.length}件をクリアしました`);
  }

  function mergeDeletedRecords(localDeleted, remoteDeleted) {
    const merged = { ...(localDeleted || {}) };
    (remoteDeleted || []).forEach(item => {
      const id = String(item.id || item.recordId || '');
      const deletedAt = Number(item.deletedAt || item.deleted_at || 0);
      if (!id || !Number.isFinite(deletedAt)) return;
      merged[id] = Math.max(Number(merged[id] || 0), deletedAt);
    });
    return merged;
  }

  function mergeDeletedMaintenance(localDeleted, remoteDeleted) {
    return mergeDeletedRecords(localDeleted, remoteDeleted);
  }

  function mergeSyncedRecords(localRecords, remoteRecords, deletedMap) {
    const byId = new Map();
    const localById = new Map(localRecords.map(r => [String(r.id), r]));

    [...localRecords, ...(remoteRecords || [])].forEach(record => {
      if (!record || record.id === null || record.id === undefined) return;
      const id = String(record.id);
      const updatedAt = Number(record.updatedAt || 0);
      const deletedAt = Number(deletedMap[id] || 0);
      if (deletedAt && deletedAt >= updatedAt) return;

      const current = byId.get(id);
      if (!current || Number(current.updatedAt || 0) <= updatedAt) {
        const local = localById.get(id);
        const localPhotos = Array.isArray(local?.photos) ? local.photos : [];
        const remotePhotos = Array.isArray(record.photos) ? record.photos : [];
        const remoteInlinePhotos = remotePhotos.filter(isSafeImageSrc);
        byId.set(id, {
          ...record,
          photos: remoteInlinePhotos.length ? remoteInlinePhotos : localPhotos,
          stops: mergeStopsPreservingLocalPhotos(record.stops, local?.stops)
        });
      }
    });

    return Array.from(byId.values()).sort((a, b) => {
      const dateCompare = String(b.dateFrom || b.date || '').localeCompare(String(a.dateFrom || a.date || ''));
      if (dateCompare) return dateCompare;
      return Number(b.id || 0) - Number(a.id || 0);
    });
  }

  function mergeSyncedMaintenance(localItems, remoteItems, deletedMap) {
    const byId = new Map();

    [...localItems, ...(remoteItems || [])].forEach(item => {
      if (!item || item.id === null || item.id === undefined || !normalizeDateValue(item.date)) return;
      const id = String(item.id);
      const updatedAt = Number(item.updatedAt || item.createdAt || 0);
      const deletedAt = Number(deletedMap[id] || 0);
      if (deletedAt && deletedAt >= updatedAt) return;

      const current = byId.get(id);
      if (!current || Number(current.updatedAt || current.createdAt || 0) <= updatedAt) {
        byId.set(id, ensureMaintenanceUpdatedAt(item, Date.now()));
      }
    });

    return Array.from(byId.values()).sort((a, b) =>
      String(b.date || '').localeCompare(String(a.date || '')) ||
      Number(b.createdAt || 0) - Number(a.createdAt || 0)
    );
  }

  // 同期待ちフラグ（オフライン中の変更を覚えておき、復帰時に自動再送する）
  function setSyncPending() {
    setStoredValue(SYNC_PENDING_STORAGE, String(Date.now()));
  }

  function getSyncPendingStamp() {
    return Number(getStoredValue(SYNC_PENDING_STORAGE)) || 0;
  }

  function clearSyncPending() {
    try {
      if (window.localStorage) localStorage.removeItem(SYNC_PENDING_STORAGE);
    } catch {}
  }

  function queueAutoSync() {
    const { apiUrl, syncKey } = getSyncSettings();
    if (!apiUrl || !syncKey) return;
    setSyncPending();
    if (syncInProgress) return;
    if (!navigator.onLine) {
      updateSyncStatus('オフライン（同期待ち）');
      return;
    }
    syncNow({ silent: true });
  }

  // 電波復帰・アプリ再表示・起動時に、未送信の変更があれば自動同期する
  function retryPendingSync() {
    const { apiUrl, syncKey } = getSyncSettings();
    if (!apiUrl || !syncKey || !getSyncPendingStamp() || syncInProgress) return;
    if (!navigator.onLine) return;
    syncNow({ silent: true, recovered: true });
  }

  function exportRecords() {
    const payload = {
      app: 'touring-record',
      version: 2,
      exportedAt: new Date().toISOString(),
      records: prepareLocalRecordsForSync().map(r => ({
        ...r,
        // バックアップは可搬性のため写真（記録全体・立ち寄り地）をdata:URLでインライン化する
        photos: Array.isArray(r.photos) ? r.photos.map(photoSrc).filter(isSafeImageSrc) : [],
        stops: Array.isArray(r.stops)
          ? r.stops.map(s => (s && Array.isArray(s.photos) && s.photos.length)
              ? { ...s, photos: s.photos.map(photoSrc).filter(isSafeImageSrc) }
              : s)
          : r.stops
      })),
      deletedRecords: Object.entries(getDeletedRecordMap()).map(([id, deletedAt]) => ({ id, deletedAt })),
      maintenance: prepareLocalMaintenanceForSync(),
      deletedMaintenance: Object.entries(getDeletedMaintenanceMap()).map(([id, deletedAt]) => ({ id, deletedAt }))
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const a = document.createElement('a');
    a.href = url;
    a.download = `touring-records-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStoredValue(LAST_EXPORT_STORAGE, String(Date.now()));
    updateBackupHealth();
    showToast('📦 記録を書き出しました');
  }

  async function importRecordsFile(file) {
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const importedRecords = Array.isArray(data) ? data : data.records;
      if (!Array.isArray(importedRecords)) throw new Error('記録ファイルを読み込めません');

      const localRecords = prepareLocalRecordsForSync();
      const localDeleted = getDeletedRecordMap();
      const importedDeleted = Array.isArray(data.deletedRecords) ? data.deletedRecords : [];
      const mergedDeleted = mergeDeletedRecords(localDeleted, importedDeleted);
      const fallbackTime = Date.now();
      const preparedImport = importedRecords.map(record => ensureRecordUpdatedAt(record, fallbackTime));
      const mergedRecords = mergeSyncedRecords(localRecords, preparedImport, mergedDeleted);

      saveDeletedRecordMap(mergedDeleted);
      saveRecords(mergedRecords);
      // 読み込んだdata:写真をIDBへ退避してref化（localStorageを溢れさせない）
      await migrateLegacyPhotos();

      // メンテナンス記録もツーリング記録と同じく更新日時と削除履歴でマージする
      const importedMaint = Array.isArray(data.maintenance) ? data.maintenance : [];
      const importedDeletedMaint = Array.isArray(data.deletedMaintenance) ? data.deletedMaintenance : [];
      const localMaint = prepareLocalMaintenanceForSync();
      const mergedDeletedMaint = mergeDeletedMaintenance(getDeletedMaintenanceMap(), importedDeletedMaint);
      const preparedMaint = importedMaint.map(m => ensureMaintenanceUpdatedAt(m, fallbackTime));
      const mergedMaint = mergeSyncedMaintenance(localMaint, preparedMaint, mergedDeletedMaint);
      saveDeletedMaintenanceMap(mergedDeletedMaint);
      saveMaintenance(mergedMaint);
      if (document.getElementById('tab-maintenance').style.display !== 'none') renderMaintenance();

      renderList();
      queueAutoSync();
      setStoredValue(LAST_IMPORT_STORAGE, String(Date.now()));
      updateBackupHealth();
      showToast(`📥 記録を読み込みました（${mergedRecords.length}件）`);
    } catch (e) {
      showError(e.message);
    }
  }

  async function syncNow(options = {}) {
    if (syncInProgress) return;
    const { apiUrl, syncKey } = getSyncSettings();
    if (!apiUrl || !syncKey) {
      showToast('同期キーとAPI URLを入力してください');
      updateSyncStatus('未設定');
      return;
    }

    setStoredValue(SYNC_API_STORAGE, apiUrl);
    setStoredValue(SYNC_KEY_STORAGE, syncKey);
    syncInProgress = true;
    updateSyncStatus('同期中…');
    const btn = document.getElementById('btn-sync-now');
    if (btn) btn.disabled = true;
    const startedAt = Date.now();

    try {
      const localRecords = prepareLocalRecordsForSync();
      const localMaintenance = prepareLocalMaintenanceForSync();
      const deletedMap = getDeletedRecordMap();
      const deletedMaintMap = getDeletedMaintenanceMap();
      const deletedRecords = Object.entries(deletedMap).map(([id, deletedAt]) => ({ id, deletedAt }));
      const deletedMaintenance = Object.entries(deletedMaintMap).map(([id, deletedAt]) => ({ id, deletedAt }));
      const maintenanceRecords = localMaintenance.map(prepareMaintenanceRecordForCloud);
      const syncDeletedRecords = [
        ...deletedRecords,
        ...deletedMaintenance.map(({ id, deletedAt }) => ({ id: maintenanceSyncRecordId(id), deletedAt }))
      ];
      const res = await fetch(`${apiUrl}/api/sync`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          syncKey,
          records: [...localRecords.map(prepareRecordForCloud), ...maintenanceRecords],
          deletedRecords: syncDeletedRecords,
          maintenance: localMaintenance,
          deletedMaintenance
        })
      });
      if (!res.ok) throw new Error(`同期APIエラー ${res.status}`);
      const data = await res.json();
      const remotePayloadRecords = Array.isArray(data.records) ? data.records : [];
      const remoteDeleted = Array.isArray(data.deletedRecords) ? data.deletedRecords : [];
      const splitRemote = splitMaintenanceSyncRecords(remotePayloadRecords);
      const splitRemoteDeleted = splitMaintenanceSyncDeletes(remoteDeleted);
      const remoteRecords = splitRemote.records;
      const remoteMaintenance = [
        ...(Array.isArray(data.maintenance) ? data.maintenance : []),
        ...splitRemote.maintenance
      ];
      const remoteDeletedMaintenance = Array.isArray(data.deletedMaintenance) ? data.deletedMaintenance : [];
      // 書き戻しは「同期中に入った変更」を消さないよう、送信時スナップショットでなく最新ローカルと再マージする
      const mergedDeleted = mergeDeletedRecords(getDeletedRecordMap(), splitRemoteDeleted.records);
      const mergedRecords = mergeSyncedRecords(prepareLocalRecordsForSync(), remoteRecords, mergedDeleted);
      const mergedDeletedMaint = mergeDeletedMaintenance(
        getDeletedMaintenanceMap(),
        [...remoteDeletedMaintenance, ...splitRemoteDeleted.maintenance]
      );
      const mergedMaintenance = mergeSyncedMaintenance(prepareLocalMaintenanceForSync(), remoteMaintenance, mergedDeletedMaint);
      saveDeletedRecordMap(mergedDeleted);
      saveDeletedMaintenanceMap(mergedDeletedMaint);
      saveRecords(mergedRecords);
      saveMaintenance(mergedMaintenance);
      renderList();
      if (document.getElementById('tab-maintenance').style.display !== 'none') renderMaintenance();
      updateSyncStatus(`同期済み 記録${mergedRecords.length}件 / メンテ${mergedMaintenance.length}件`);
      updateBackupHealth();
      if (getSyncPendingStamp() > startedAt) {
        // 同期中に入った変更を続けて送る
        setTimeout(queueAutoSync, 100);
      } else {
        clearSyncPending();
      }
      if (options.recovered) showToast('☁️ オフライン中の変更を同期しました');
      else if (!options.silent) showToast(`☁️ 同期しました（記録${mergedRecords.length}件・メンテ${mergedMaintenance.length}件）`);
    } catch (e) {
      updateSyncStatus(navigator.onLine ? '同期失敗' : 'オフライン（同期待ち）');
      if (!options.silent) showError(e.message);
    } finally {
      syncInProgress = false;
      if (btn) btn.disabled = false;
    }
  }

  function setMainRating(value) {
    rating = value || 0;
    document.querySelectorAll('.star').forEach(s => {
      s.classList.toggle('on', parseInt(s.dataset.v) <= rating);
    });
  }

  async function editRecord(id) {
    await ensurePhotoStoreReady();
    const r = getRecords().find(x => sameId(x.id, id));
    if (!r) return;

    editingId = id;
    document.getElementById('f-title').value = r.title || '';
    document.getElementById('f-date-from').value = r.dateFrom || r.date || '';
    document.getElementById('f-date-to').value = r.dateTo || r.dateFrom || r.date || '';
    document.getElementById('f-from').value = r.from || '';
    document.getElementById('f-to').value = r.to || '';
    const distances = normalizeDistances(r.distances, r.km, r.stops);
    document.getElementById('distance-list').innerHTML = '';
    if (distances.length === 0) {
      addDistanceRow(DISTANCE_KIND_BIKE, '');
    } else {
      distances.forEach(d => addDistanceRow(d.kind, d.km));
    }
    renderDailyDistanceRows(normalizeDailyDistances(
      r.dailyDistances,
      r.dateFrom || r.date || '',
      r.dateTo || r.dateFrom || r.date || '',
      distanceSumByKind(distances, DISTANCE_KIND_BIKE)
    ));
    renderCalcBasis(Array.isArray(r.calcBasis) ? r.calcBasis : []);

    document.getElementById('f-fuel-cost').value = r.fuelCost || '';
    document.getElementById('f-memo').value = r.memo || '';

    normalizeStops(r.stops).forEach(s => addStop(s.name, s.memo, s.rating, s.type, s.toName, s.vehicle, s.distanceKm, s.date, (s.photos || []).filter(isStorablePhoto)));
    photoData = Array.isArray(r.photos) ? r.photos.filter(isStorablePhoto).slice(0, MAX_PHOTOS) : [];
    renderPhotoPreview();
    setMainRating(r.rating || 0);
    updateDays();
    renderDailyDistanceRows(normalizeDailyDistances(
      r.dailyDistances,
      r.dateFrom || r.date || '',
      r.dateTo || r.dateFrom || r.date || '',
      distanceSumByKind(distances, DISTANCE_KIND_BIKE)
    ), r.dailyWeather || []);
    updateFuelEff();
    document.getElementById('save-btn').textContent = '💾 変更を保存する';
    document.getElementById('cancel-edit-btn').style.display = 'block';
    switchTab('add');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast('編集できます');
  }

  function cancelEdit() {
    resetForm();
    showToast('編集をキャンセルしました');

  // 一覧表示
  function renderList() {
    const q = document.getElementById('search').value.toLowerCase();
    const list = getRecords().filter(r => {
      const stops = normalizeStops(r.stops);
      return (r.title || '').toLowerCase().includes(q) ||
        (r.to || '').toLowerCase().includes(q) ||
        (r.from || '').toLowerCase().includes(q) ||
        (r.memo || '').toLowerCase().includes(q) ||
        stops.some(s =>
          (s.name || '').toLowerCase().includes(q) ||
          (s.toName || '').toLowerCase().includes(q) ||
          (s.memo || '').toLowerCase().includes(q) ||
          (s.date || '').toLowerCase().includes(q) ||
          formatDate(s.date).toLowerCase().includes(q)
        );
    });

    const all       = getRecords();
    const totalBikeKm  = all.reduce((s, r) => s + getRecordBikeKm(r), 0);
    const totalFerryKm = all.reduce((s, r) => s + distanceSumByKind(normalizeDistances(r.distances, r.km, r.stops), DISTANCE_KIND_FERRY), 0);
    const totalCost = all.reduce((s, r) => s + safeNumber(r.fuelCost), 0);
    const totalDays = all.reduce((s, r) => {
      if (!r.dateFrom) return s + 1;
      const to = r.dateTo && r.dateTo >= r.dateFrom ? r.dateTo : r.dateFrom;
      return s + Math.round((new Date(to) - new Date(r.dateFrom)) / 86400000) + 1;
    }, 0);
    document.getElementById('stat-count').textContent = all.length;
    document.getElementById('stat-km-bike').textContent  = Math.round(totalBikeKm).toLocaleString();
    document.getElementById('stat-km-bike-day').textContent = totalDays > 0 ? Math.round(totalBikeKm / totalDays).toLocaleString() : '0';
    document.getElementById('stat-km-ferry').textContent = Math.round(totalFerryKm).toLocaleString();
    document.getElementById('stat-days').textContent  = totalDays;
    document.getElementById('stat-cost').textContent  = totalCost.toLocaleString();

    const el = document.getElementById('record-list');
    if (list.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">🏍️</div>記録がまだありません。<br>最初のツーリングを記録しよう！</div>`;
      return;
    }

    el.innerHTML = list.map(r => {
      const distances = normalizeDistances(r.distances, r.km, r.stops);
      const bikeKm = getRecordBikeKm(r);
      const ferryKm = distanceSumByKind(distances, DISTANCE_KIND_FERRY);
      const otherDistances = distances.filter(d => d.kind !== DISTANCE_KIND_BIKE && d.kind !== DISTANCE_KIND_FERRY);
      const fuel = safeNumber(r.fuel);
      const fuelCost = safeNumber(r.fuelCost);
      const safeRating = clampInt(r.rating, 0, 5);
      const recordId = String(r.id || '');
      const photos = Array.isArray(r.photos) ? r.photos.map(photoSrc).filter(isSafeImageSrc).slice(0, MAX_PHOTOS) : [];
      const detailsLabel = photos.length ? `詳細・写真を見る（${photos.length}枚）` : '経路・詳細を見る';
      return `
      <div class="record-card">
        <div class="record-header">
          <div class="record-title">${r.title ? escape(r.title) : `📍 ${escape(r.to)}`}</div>
          <div class="record-date">${escape(formatDateRange(r))}</div>
        </div>
        <div class="record-compact-route">${renderCompactRoute(r)}</div>
        <div class="record-meta">
          ${bikeKm  ? `<span>🏍️ ${Math.round(bikeKm).toLocaleString()} km</span>` : ''}
          ${ferryKm ? `<span>⛴️ ${Math.round(ferryKm).toLocaleString()} km</span>` : ''}
          ${otherDistances.map(d => `<span>📦 ${escape(d.kind)} ${Math.round(d.km).toLocaleString()} km</span>`).join('')}
          ${fuel     ? `<span>⛽ ${fuel} L</span>` : ''}
          ${fuelCost ? `<span>💴 ${fuelCost.toLocaleString()} 円</span>` : ''}
          ${bikeKm && fuel ? `<span>⚡ ${(bikeKm / fuel).toFixed(1)} km/L</span>` : ''}
          <span>${escape(r.weather || '')}</span>
        </div>
        <details class="record-details">
          <summary>${escape(detailsLabel)}</summary>
          <div class="record-details-body">
            ${renderRecordRoute(r, bikeKm)}
            ${safeRating ? `<div class="record-stars">${'★'.repeat(safeRating)}${'☆'.repeat(5 - safeRating)}</div>` : ''}
            ${r.memo ? `<div class="record-memo">${escape(r.memo)}</div>` : ''}
            ${photos.length ? `
              <div class="record-photos">
                ${photos.map(p => `<img src="${escapeAttr(p)}" data-modal-src="${escapeAttr(p)}" alt="" />`).join('')}
              </div>` : ''}

          </div>

        <div class="record-actions">

          <button class="btn-gmap-small" data-record-action="edit" data-record-id="${escapeAttr(recordId)}">✏️ 編集</button>
          <button class="btn-delete" data-record-action="delete" data-record-id="${escapeAttr(recordId)}">🗑️ 削除</button>
        </div>
      </div>
    `}).join('');
  }

  function renderCompactRoute(r) {
    const parts = [];
    if (r.from) parts.push(`🗺️ ${r.from}`);
    const stops = normalizeStops(r.stops).filter(s => s.name || s.toName);
    if (stops.length) {
      const first = stops[0];
      const last = stops[stops.length - 1];
      if (first.name) parts.push(first.type === 'ferry' ? `⛴️ ${first.name}` : `🚩 ${first.name}`);
      if (stops.length > 2) parts.push(`…${stops.length - 2}件`);
      const lastName = last.toName || last.name;
      if (lastName && lastName !== first.name) parts.push(last.type === 'ferry' ? `⚓ ${lastName}` : `🚩 ${lastName}`);
    }
    if (r.to) parts.push(`📍 ${r.to}`);
    return escape(parts.filter(Boolean).join(' → ') || '経路未入力');
  }

  function renderRecordCalcBasis(r) {
    const items = Array.isArray(r.calcBasis) ? r.calcBasis : [];
    if (!items.length) return '';
    return `
      <div class="record-calc-basis">
        <div class="record-calc-basis-title">距離計算の根拠</div>
        ${items.map(item => `
          <div class="record-calc-basis-row">
            <div>${escape(item.kind || '')}</div>
            <div>${escape(item.date ? `${formatShortDate(item.date)} ` : '')}${escape(item.from || '')} → ${escape(item.to || '')}${item.estimated ? '（推定）' : ''}</div>
            <div class="record-calc-basis-km">${Math.round(safeNumber(item.km)).toLocaleString()} km</div>
          </div>`).join('')}
      </div>`;
  }

  function routeLink(place, label, className = 'place') {
    return `<span class="${className} map-link" data-map-place="${escapeAttr(place)}">${escape(label)}</span>`;
  }

  function stopRouteSegment(s, withDate = true) {
    if (s.type === 'ferry') {
      const ferry = [];
      if (s.name) ferry.push(routeLink(s.name, withDate ? stopRouteLabel('⛴️', s.name, s.date) : `⛴️ ${s.name}`, 'place ferry-place'));
      if (s.name && s.toName) ferry.push('<span class="arrow ferry-arrow">⇢</span>');
      if (s.toName) ferry.push(routeLink(s.toName, `⚓ ${s.toName}`, 'place ferry-place'));
      return ferry.length ? `<span>${ferry.join('')}</span>` : '';
    }
    if (s.name) {
      const icon = s.vehicle === 'ferry' ? '⛴️' : '🏍️';
      return routeLink(s.name, withDate ? stopRouteLabel(icon, s.name, s.date) : `${icon} ${s.name}`);
    }
    return '';
  }

  function renderRouteFlow(r) {
    const segments = [];
    if (r.from) segments.push(routeLink(r.from, `🗺️ ${r.from}`));
    normalizeStops(r.stops).forEach(s => {
      const seg = stopRouteSegment(s, true);
      if (seg) segments.push(seg);
    });
    if (r.to) segments.push(routeLink(r.to, `📍 ${r.to}`));
    return segments.join('<span class="arrow">▶</span>');
  }

  // 立ち寄り地に日付がある記録は日別グルーピング、ない記録は従来表示
  function renderRecordRoute(r, bikeKm) {
    const dayGroups = renderDayGroups(r, bikeKm);
    if (dayGroups !== null) return dayGroups;
    return `
        <div class="route-flow">
          ${renderRouteFlow(r)}
        </div>
        ${renderStopNotes(r)}
        ${renderDailyDistances(r, bikeKm)}`;
  }

  function renderDayGroups(r, bikeKm) {
    const stops = normalizeStops(r.stops);
    if (!r.dateFrom || !stops.some(s => s.date)) return null;
    const daily = getRecordDailyDistances(r, bikeKm);
    const kmByDate = new Map(daily.map(d => [d.date, Number(d.bikeKm || 0)]));
    const weatherByDate = new Map((r.dailyWeather || []).map(d => [d.date, d.weather]));

    const groups = new Map();
    const ensure = date => {
      if (!groups.has(date)) groups.set(date, { date, stops: [] });
      return groups.get(date);
    };
    ensure(r.dateFrom);
    let currentDate = r.dateFrom;
    stops.forEach(s => {
      if (s.date) currentDate = s.date;
      ensure(currentDate).stops.push(s);
    });
    kmByDate.forEach((km, date) => { if (km > 0) ensure(date); });
    weatherByDate.forEach((w, date) => { if (w) ensure(date); });
    if (r.dateTo && r.dateTo >= r.dateFrom) ensure(r.dateTo);

    const ordered = Array.from(groups.values()).sort((a, b) => a.date.localeCompare(b.date));
    const lastIdx = ordered.length - 1;
    return ordered.map((g, i) => {
      const segments = [];
      if (i === 0 && r.from) segments.push(routeLink(r.from, `🗺️ ${r.from}`));
      g.stops.forEach(s => {
        const seg = stopRouteSegment(s, false);
        if (seg) segments.push(seg);
      });
      if (i === lastIdx && r.to) segments.push(routeLink(r.to, `📍 ${r.to}`));
      const metaParts = [];
      const w = weatherByDate.get(g.date);
      const km = kmByDate.get(g.date) || 0;
      if (w) metaParts.push(escape(w));
      if (km > 0) metaParts.push(`🏍️ ${Math.round(km).toLocaleString()} km`);
      const notes = g.stops.filter(s => s.memo || clampInt(s.rating, 0, 5) > 0);
      return `
      <div class="day-group">
        <div class="day-header">📅 ${escape(formatShortDate(g.date) || g.date)}${metaParts.length ? `<span class="day-header-meta">${metaParts.join('　')}</span>` : ''}</div>
        ${segments.length ? `<div class="route-flow">${segments.join('<span class="arrow">▶</span>')}</div>` : ''}
        ${notes.map(s => stopNoteCard(s, false)).join('')}
      </div>`;
    }).join('');
  }

  function stopNoteCard(s, showDate = true) {
    let title, color;
    const safeRating = clampInt(s.rating, 0, 5);
    if (s.type === 'ferry') {
      title = `⛴️ ${s.name || '乗船港未入力'}${s.toName ? ` ⇢ ${s.toName}` : ''}`;
      color = '#83d4cf';
    } else if (s.vehicle === 'ferry') {
      title = `⛴️ ${s.name}`;
      color = '#83d4cf';
    } else {
      title = `🏍️ ${s.name}`;
      color = '#e94560';
    }
    const dateLine = showDate && s.date
      ? `<div style="font-size:0.78rem;color:#aaa;margin-bottom:3px;">📅 ${escape(formatDate(s.date))}</div>`
      : '';
    const memoLine = s.memo
      ? `<div style="font-size:0.88rem;color:#ccc;white-space:pre-wrap;">${escape(s.memo)}</div>`
      : '';
    const stopPhotos = (s.photos || []).map(photoSrc).filter(isSafeImageSrc);
    const photoLine = stopPhotos.length
      ? `<div class="record-photos stop-note-photos">${stopPhotos.map(p => `<img src="${escapeAttr(p)}" data-modal-src="${escapeAttr(p)}" alt="" />`).join('')}</div>`
      : '';
    return `
            <div style="border-left:3px solid ${color};padding:6px 10px;margin-bottom:6px;background:#0f3460;border-radius:0 6px 6px 0;">
              <div style="font-size:0.8rem;color:${color};margin-bottom:3px;">${escape(title)}${safeRating ? `　<span style="color:#f5a623;">${'★'.repeat(safeRating)}${'☆'.repeat(5-safeRating)}</span>` : ''}</div>
              ${dateLine}
              ${memoLine}
              ${photoLine}
            </div>`;
  }

  function renderStopNotes(r) {
    const notes = normalizeStops(r.stops).filter(s => s.memo || s.date || (s.photos && s.photos.length));
    if (!notes.length) return '';
    return `
      <div style="margin-bottom:10px;">
        ${notes.map(s => stopNoteCard(s, true)).join('')}
      </div>`;
  }

  function renderDailyDistances(r, bikeKm) {
    const daily = getRecordDailyDistances(r, bikeKm);
    if (!daily.length) return '';
    const weatherByDate = new Map((r.dailyWeather || []).map(d => [d.date, d.weather]));
    return `
      <div class="daily-distance-display">
        ${daily.map(d => {
          const w = weatherByDate.get(d.date) || '';
          return `<span class="daily-distance-pill">${w ? escape(w) + ' ' : '🏍️ '}${escape(formatShortDate(d.date))} ${Math.round(d.bikeKm).toLocaleString()} km</span>`;
        }).join('')}
      </div>`;
  }

  function stopRouteLabel(icon, name, date) {
    const dateLabel = formatShortDate(date);
    return `${icon} ${dateLabel ? `${dateLabel} ` : ''}${name}`;
  }

  function formatDate(d) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    if (!/^\d{4}$/.test(y) || !/^\d{2}$/.test(m) || !/^\d{2}$/.test(day)) return '';
    return `${y}年${m}月${day}日`;
  }
  function formatShortDate(d) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    if (!/^\d{4}$/.test(y) || !/^\d{2}$/.test(m) || !/^\d{2}$/.test(day)) return '';
    return `${Number(m)}/${Number(day)}`;
  }
  function formatDateRange(r) {
    const from = r.dateFrom || r.date;
    const to   = r.dateTo;
    if (!from) return '';
    if (!to || to === from) return formatDate(from);
    const days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;
    return `${formatDate(from)} 〜 ${formatDate(to)}（${days}日間）`;
  }
  function escapeAttr(s) {
    return escape(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escape(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function sameId(a, b) {
    return String(a) === String(b);
  }
  function safeNumber(value) {
    const num = Number(value);
    return Number.isFinite(num) && num > 0 ? num : 0;
  }
  function nonNegativeNumber(value) {
    const num = Number(value);
    return Number.isFinite(num) && num >= 0 ? num : null;
  }
  function normalizeDistanceKm(value) {
    const num = Number(value);
    return Number.isFinite(num) && num > 0 ? num : null;
  }
  function normalizeDateValue(value) {
    const text = String(value || '').trim();
    return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : '';
  }
  function clampInt(value, min, max) {
    const num = Number.parseInt(value, 10);
    if (!Number.isFinite(num)) return min;
    return Math.min(max, Math.max(min, num));
  }
  function isSafeImageSrc(src) {
    return /^data:image\/(?:jpeg|jpg|png|gif|webp);base64,[a-z0-9+/=\s]+$/i.test(String(src || ''));
  }

  // ===== 写真ストア（IndexedDB） =====
  // 容量の大きい写真はlocalStorageを溢れさせるため、IDBへ保存しlocalStorageには
  // 軽い参照(idbphoto:<id>)だけ残す。表示・編集・書き出しは起動時に読み込む
  // メモリキャッシュ(photoCache)から同期的に解決する。IDB非対応や書き込み失敗時は
  // data:URLのまま扱い、後方互換と「写真を絶対に失わない」を保つ。
  const PHOTO_DB_NAME = 'touring-photos';
  const PHOTO_STORE = 'photos';
  const PHOTO_REF_PREFIX = 'idbphoto:';
  const photoCache = new Map();
  let photoDBPromise = null;
  let photoStoreReady = null;
  let photoDbRepairTried = false;

  function isPhotoRef(s) { return typeof s === 'string' && s.startsWith(PHOTO_REF_PREFIX); }
  function isStorablePhoto(s) { return isPhotoRef(s) || isSafeImageSrc(s); }
  // 表示用に data:URL へ解決（同期）。未解決のrefは空文字を返す。
  function photoSrc(s) {
    if (isPhotoRef(s)) return photoCache.get(s) || '';
    return isSafeImageSrc(s) ? s : '';
  }

  // iOS Safari等でIndexedDBのopen/transactionが無応答のまま固まることがあるため、
  // すべてのIDB操作をタイムアウトで包み「固まらず、失敗時は安全に諦める」ようにする。
  function withTimeout(promise, ms, label) {
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error((label || 'IndexedDB') + ' timeout')), ms);
      Promise.resolve(promise).then(
        v => { clearTimeout(t); resolve(v); },
        e => { clearTimeout(t); reject(e); }
      );
    });
  }

  function openPhotoDB() {
    if (photoDBPromise) return photoDBPromise;
    photoDBPromise = withTimeout(new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB非対応')); return; }
      const req = indexedDB.open(PHOTO_DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(PHOTO_STORE);
      req.onsuccess = () => {
        const db = req.result;
        // iOSはPWAのバックグラウンド化やメモリ逼迫で接続を勝手に閉じる。
        // 閉じたらキャッシュを破棄し、次回openで開き直せるようにする。
        db.onclose = () => { photoDBPromise = null; };
        db.onversionchange = () => { try { db.close(); } catch {} photoDBPromise = null; };
        resolve(db);
      };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
    }), 6000, 'IndexedDB open');
    photoDBPromise.catch(() => { photoDBPromise = null; });
    return photoDBPromise;
  }

  // 破損したIndexedDBを削除して作り直す（内部エラー復旧用）。
  // 写真本体はlocalStorage側にdata:URLで残っているため、作り直しても失われない。
  function deletePhotoDB() {
    return withTimeout(new Promise(resolve => {
      const req = indexedDB.deleteDatabase(PHOTO_DB_NAME);
      req.onsuccess = () => resolve(true);
      req.onerror = () => resolve(false);
      req.onblocked = () => resolve(false);
    }), 6000, 'IndexedDB delete-db');
  }

  async function repairPhotoDB() {
    try { const db = await photoDBPromise; if (db && db.close) db.close(); } catch {}
    photoDBPromise = null;
    await deletePhotoDB();
    photoDBPromise = null;
  }

  // IDB操作が失敗したときの自己修復：
  // ①接続が閉じかけ系 → キャッシュを捨てて開き直し1回再試行
  // ②内部エラー/破損系 → DBを作り直して1回だけ復旧を試みる（セッション内1回まで）
  function withFreshDB(op, retried) {
    return openPhotoDB().then(op).catch(async err => {
      const msg = String((err && (err.name + ' ' + err.message)) || err);
      if (!retried && /clos|InvalidState|InvalidAccess|TransactionInactive|NotFound/i.test(msg)) {
        photoDBPromise = null;
        return withFreshDB(op, true);
      }
      if (!photoDbRepairTried && /internal error|UnknownError|DataError|corrupt/i.test(msg)) {
        photoDbRepairTried = true;
        await repairPhotoDB();
        return withFreshDB(op, true);
      }
      throw err;
    });
  }

  function idbGetAllPhotos() {
    return withFreshDB(db => withTimeout(new Promise((resolve, reject) => {
      const tx = db.transaction(PHOTO_STORE, 'readonly');
      const store = tx.objectStore(PHOTO_STORE);
      const keysReq = store.getAllKeys();
      const valsReq = store.getAll();
      tx.oncomplete = () => resolve(keysReq.result.map((id, i) => ({ id, data: valsReq.result[i] })));
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    }), 10000, 'IndexedDB read'));
  }

  function idbDeletePhotos(ids) {
    const targets = (ids || []).filter(Boolean);
    if (!targets.length) return Promise.resolve(0);
    return withFreshDB(db => withTimeout(new Promise((resolve, reject) => {
      const tx = db.transaction(PHOTO_STORE, 'readwrite');
      const store = tx.objectStore(PHOTO_STORE);
      targets.forEach(id => store.delete(id));
      tx.oncomplete = () => resolve(targets.length);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    }), 10000, 'IndexedDB delete'));
  }

  function idbPutPhoto(dataUrl) {
    const id = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
    return withFreshDB(db => withTimeout(new Promise((resolve, reject) => {
      const tx = db.transaction(PHOTO_STORE, 'readwrite');
      tx.objectStore(PHOTO_STORE).put(dataUrl, id);
      tx.oncomplete = () => resolve(PHOTO_REF_PREFIX + id);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    }), 8000, 'IndexedDB write'));
  }

  // data:URL を IDB へ保存して ref を返す。失敗時は data:URL のまま返す（無損失）。
  async function storePhoto(src) {
    if (isPhotoRef(src)) return src;
    if (!isSafeImageSrc(src)) return null;
    try {
      const ref = await idbPutPhoto(src);
      photoCache.set(ref, src);
      return ref;
    } catch {
      return src;
    }
  }
  async function storePhotos(list) {
    const out = [];
    for (const p of (list || [])) {
      const ref = await storePhoto(p);
      if (ref) out.push(ref);
    }
    return out;
  }

  // data:写真の配列をIDBへ退避してref配列にする（冪等・無損失：失敗時はdata:のまま残す）
  async function migratePhotoArray(arr) {
    const next = [];
    let changed = false;
    for (const p of (arr || [])) {
      if (isPhotoRef(p)) { next.push(p); continue; }
      if (!isSafeImageSrc(p)) continue;
      try {
        const ref = await idbPutPhoto(p);
        photoCache.set(ref, p);
        next.push(ref);
        changed = true;
      } catch {
        next.push(p);
      }
    }
    return { photos: next, changed };
  }

  // localStorage内のレガシーdata:写真（記録全体・立ち寄り地）をIDBへ退避してrefに置き換える
  async function migrateLegacyPhotos() {
    if (!window.indexedDB) return;
    const records = getRecords();
    let changed = false;
    for (const r of records) {
      if (Array.isArray(r.photos) && r.photos.length) {
        const res = await migratePhotoArray(r.photos);
        r.photos = res.photos;
        changed = changed || res.changed;
      }
      if (Array.isArray(r.stops)) {
        for (const s of r.stops) {
          if (s && Array.isArray(s.photos) && s.photos.length) {
            const res = await migratePhotoArray(s.photos);
            s.photos = res.photos;
            changed = changed || res.changed;
          }
        }
      }
    }
    if (changed) saveRecords(records);
  }

  async function initPhotoStore() {
    if (!window.indexedDB) return;
    try {
      for (const { id, data } of await idbGetAllPhotos()) {
        if (isSafeImageSrc(data)) photoCache.set(PHOTO_REF_PREFIX + id, data);
      }
    } catch {}
    await migrateLegacyPhotos();
  }

  function ensurePhotoStoreReady() {
    if (!photoStoreReady) {
      photoStoreReady = initPhotoStore().catch(() => {});
    }
    return photoStoreReady;
  }

  async function cleanupUnusedPhotos() {
    if (!window.indexedDB) {
      showToast('このブラウザでは写真整理が使えません');
      return;
    }
    showToast('未使用写真を確認中…');
    await ensurePhotoStoreReady();
    const { refs } = collectRecordPhotos();
    const photos = await idbGetAllPhotos();
    const unused = photos.filter(item => !refs.has(PHOTO_REF_PREFIX + item.id));
    if (!unused.length) {
      showToast('整理できる未使用写真はありません');
      updateStorageMeter();
      return;
    }
    if (!confirm(`記録で使われていない写真データ ${unused.length}枚を整理します。記録に表示中の写真は残します。よろしいですか？`)) return;
    await idbDeletePhotos(unused.map(item => item.id));
    unused.forEach(item => photoCache.delete(PHOTO_REF_PREFIX + item.id));
    await updateStorageMeter();
    renderList();
    showToast(`未使用写真 ${unused.length}枚を整理しました`);
  }

  // メンテナンス記録
  function getMaintenance() {

      if (!window.localStorage) return [...memoryMaintenance];

  function maintIcon(type) {
    const t = String(type || '');
    if (t.includes('オイル')) return '🛢';
    if (t.includes('タイヤ')) return '🛞';
    if (t.includes('チェーン')) return '⛓️';

    if (t.includes('車検') || t.includes('点検')) return '📋';
    return '🔧';
  }

  function maintenanceKmLimit(type) {
    const t = String(type || '');
    if (t.includes('オイル')) return { watch: 3000, due: 5000 };
    if (t.includes('タイヤ')) return { watch: 8000, due: 12000 };
    if (t.includes('チェーン')) return { watch: 1500, due: 2500 };
    if (t.includes('ブレーキ')) return { watch: 8000, due: 12000 };
    if (t.includes('車検') || t.includes('点検')) return { watch: 10000, due: 24000 };
    return { watch: 3000, due: 5000 };
  }

  function maintenanceStatus(type, kmSince) {
    const limit = maintenanceKmLimit(type);
    const km = safeNumber(kmSince);
    if (km >= limit.due) {
      return { cardClass: 'maint-due', pillClass: 'due', label: '交換時期' };
    }
    if (km >= limit.watch) {
      return { cardClass: 'maint-watch', pillClass: 'watch', label: 'そろそろ' };
    }
    return { cardClass: 'maint-ok', pillClass: 'ok', label: 'まだ余裕' };
  }

  // 指定日以降に走ったバイクkm（ツーリング記録から日付ベースで集計）
  function bikeKmSince(dateStr) {
    if (!dateStr) return 0;
    return getRecords().reduce((sum, r) => {
      const from = normalizeDateValue(r.dateFrom || r.date);
      if (!from) return sum;
      const toRaw = normalizeDateValue(r.dateTo);
      const to = toRaw && toRaw >= from ? toRaw : from;
      if (to < dateStr) return sum;
      if (from >= dateStr) return sum + getRecordBikeKm(r);
      // 実施日をまたぐ記録：日毎距離があれば実施日以降の分だけ合算する
      const daily = getRecordDailyDistances(r, 0);
      if (daily.length) {
        return sum + daily.filter(d => d.date >= dateStr).reduce((s, d) => s + safeNumber(d.bikeKm), 0);
      }
      return sum + getRecordBikeKm(r);
    }, 0);
  }

  function maintenanceOdoAnchor(item) {
    const odo = safeNumber(item?.odoKm);
    if (!odo) return null;
    return {
      odo,
      date: normalizeDateValue(item?.date),
      createdAt: safeNumber(item?.createdAt),
      updatedAt: safeNumber(item?.updatedAt)
    };
  }

  // 現在ODOの推定：実メーターは単調増加なので最大ODOの記録を基準点にし、
  // その実施日以降に走った記録kmを日付ベースで加算する（過去メンテの後入力でも狂わない）
  function estimateCurrentOdo(items) {
    const manualOdo = getCurrentOdoSetting();
    if (manualOdo) return manualOdo;
    const anchors = (items || []).map(maintenanceOdoAnchor).filter(Boolean);
    if (!anchors.length) return null;
    anchors.sort((a, b) =>
      (a.odo - b.odo) ||
      a.date.localeCompare(b.date) ||
      ((a.updatedAt || a.createdAt || 0) - (b.updatedAt || b.createdAt || 0))
    );
    const latest = anchors[anchors.length - 1];
    return latest.odo + bikeKmSince(latest.date);
  }

  function maintenanceKmSince(item, currentOdo) {
    const odo = safeNumber(item?.odoKm);
    if (odo && currentOdo !== null) return Math.max(0, currentOdo - odo);
    return bikeKmSince(item?.date);
  }

  function saveMaintenanceEntry() {
    const typeSel = document.getElementById('m-type').value;
    const custom = document.getElementById('m-custom').value.trim();
    const type = typeSel === 'その他' ? (custom || 'その他') : typeSel;
    const date = normalizeDateValue(document.getElementById('m-date').value);
    if (!date) { showError('実施日を入力してください'); return; }
    const cost = safeNumber(document.getElementById('m-cost').value);
    const odo = safeNumber(document.getElementById('m-odo').value);
    const memo = document.getElementById('m-memo').value.trim();
    const items = getMaintenance();
    const now = Date.now();
    const wasEditing = editingMaintenanceId !== null;
    const existing = wasEditing ? items.find(m => sameId(m.id, editingMaintenanceId)) : null;
    if (wasEditing && !existing) {
      resetMaintenanceForm();
      renderMaintenance();
      showError('編集対象のメンテナンス記録が見つかりません');
      return;
    }
    const existingTotalKmAtTime = nonNegativeNumber(existing?.totalKmAtTime);
    const totalKmAtTime = existingTotalKmAtTime !== null ? existingTotalKmAtTime : Math.round(getTotalBikeKm());
    const entry = {
      ...(existing || {}),
      id: wasEditing ? String(editingMaintenanceId) : `m${now}${Math.floor(Math.random() * 100000)}`,
      type,
      date,
      totalKmAtTime,
      odoKm: odo || null,
      cost: cost || null,
      memo,
      createdAt: safeNumber(existing?.createdAt) || now,
      updatedAt: now
    };
    saveMaintenance(wasEditing
      ? items.map(item => sameId(item.id, editingMaintenanceId) ? entry : item)
      : [...items, entry]
    );
    resetMaintenanceForm();
    renderMaintenance();
    queueAutoSync();
    showToast(wasEditing ? '✅ メンテナンスを更新しました' : '🔧 メンテナンスを記録しました');
  }

  // 過去記録が「次の同種交換」までに走った距離（その時どれだけ持ったか）
  function maintenanceIntervalKm(item, successor) {
    const a = safeNumber(item?.odoKm), b = safeNumber(successor?.odoKm);
    if (a && b && b >= a) return b - a;
    const d1 = normalizeDateValue(item?.date), d2 = normalizeDateValue(successor?.date);
    if (d1 && d2) return Math.max(0, bikeKmSince(d1) - bikeKmSince(d2));
    return null;
  }

  function renderMaintenance() {
    const items = getMaintenance().slice().sort((a, b) =>
      String(b.date || '').localeCompare(String(a.date || '')) || (b.createdAt || 0) - (a.createdAt || 0)
    );
    const currentOdo = estimateCurrentOdo(items);
    updateCurrentOdoStatus(currentOdo);

    // 種類ごとの最新記録 → 「交換から○km」カード
    const latestByType = new Map();
    items.forEach(m => { if (!latestByType.has(m.type)) latestByType.set(m.type, m); });

    // 各記録の「次の（より新しい）同種交換」＝successor、「前回（より古い）同種交換」＝predecessor。
    // items は新しい順。successor判定で「最新かどうか」、predecessorで「前回からの距離」を出す。
    const successorOf = new Map();
    const seenByType = new Map();
    items.forEach(m => {
      if (seenByType.has(m.type)) successorOf.set(m, seenByType.get(m.type));
      seenByType.set(m.type, m);
    });
    const predecessorOf = new Map();
    const prevByType = new Map();
    [...items].reverse().forEach(m => {
      if (prevByType.has(m.type)) predecessorOf.set(m, prevByType.get(m.type));
      prevByType.set(m.type, m);
    });

    const status = document.getElementById('maint-status');
    status.innerHTML = latestByType.size === 0 ? '' : `<div class="stats-bar">${
      [...latestByType.values()].map(m => {
        const kmSince = maintenanceKmSince(m, currentOdo);
        const state = maintenanceStatus(m.type, kmSince);
        return `
        <div class="stat-box ${state.cardClass}">
          <div class="num">${Math.round(kmSince).toLocaleString()}</div>
          <div class="lbl">${maintIcon(m.type)} ${escape(m.type)}から km<br><span class="maintenance-status-pill ${state.pillClass}">${state.label}</span></div>
        </div>`;
      }).join('')
    }</div>`;

    const el = document.getElementById('maint-list');
    if (!items.length) {
      el.innerHTML = `<div class="empty-state"><div class="icon">🔧</div>メンテナンス記録がまだありません。<br>オイル交換やタイヤ交換を記録しよう！</div>`;
      return;
    }
    el.innerHTML = items.map(m => {
      const predecessor = predecessorOf.get(m);
      const isLatestOfType = !successorOf.get(m);
      const odoBased = safeNumber(m.odoKm) && currentOdo !== null;
      // 判定距離は「前回の同種交換からこの交換までの距離」。
      // 前回がある記録 → 前回からの間隔で まだ余裕／そろそろ／交換時期。
      // 前回がない（初回）記録 → 単独なら今までの距離でライブ判定、後続があれば「初回交換」。
      let kmForStatus = null, kmLine = '', neutralLabel = '';
      if (predecessor) {
        const interval = maintenanceIntervalKm(predecessor, m);
        if (interval !== null) {
          kmForStatus = interval;
          kmLine = `🏍️ 前回から ${Math.round(interval).toLocaleString()} km 走行で交換`;
        } else {
          neutralLabel = '記録';
        }
      } else {
        // カテゴリー初回（前回なし）：新車0kmからこの交換までの距離で まだ余裕／そろそろ／交換時期 を判定
        const odo = safeNumber(m.odoKm);
        if (odo) {
          kmForStatus = odo;
          kmLine = `🏍️ 0kmから ${Math.round(odo).toLocaleString()} km 走行で交換`;
        } else if (isLatestOfType) {
          // 距離計の記録がない単独記録は、実施から今までの距離でライブ判定（フォールバック）
          kmForStatus = maintenanceKmSince(m, currentOdo);
          kmLine = `🏍️ 実施から ${Math.round(kmForStatus).toLocaleString()} km 走行${odoBased ? '（ODO基準）' : ''}`;
        } else {
          neutralLabel = '初回';
          kmLine = '🏍️ 初回交換（距離計の記録なし）';
        }
      }
      const state = kmForStatus !== null
        ? maintenanceStatus(m.type, kmForStatus)
        : { cardClass: 'maint-done', pillClass: 'done', label: neutralLabel || '記録' };
      return `
      <div class="record-card ${state.cardClass}">
        <div class="record-header">
          <div class="record-title">${maintIcon(m.type)} ${escape(m.type)}</div>
          <div class="record-date">${escape(formatDate(m.date))}</div>
        </div>
        <div class="record-meta">
          <span class="maintenance-status-pill ${state.pillClass}">${state.label}</span>
          ${kmLine ? `<span>${kmLine}</span>` : ''}
          ${safeNumber(m.odoKm) ? `<span>🔢 距離計 ${safeNumber(m.odoKm).toLocaleString()} km</span>` : ''}
          ${safeNumber(m.cost) ? `<span>💴 ${safeNumber(m.cost).toLocaleString()} 円</span>` : ''}
        </div>
        ${m.memo ? `<div class="record-memo">${escape(m.memo)}</div>` : ''}
        <div class="record-actions">
          <button class="btn-gmap-small" data-maint-action="edit" data-maint-id="${escapeAttr(String(m.id))}">✏️ 編集</button>
          <button class="btn-delete" data-maint-action="delete" data-maint-id="${escapeAttr(String(m.id))}">🗑️ 削除</button>
        </div>
      </div>`;
    }).join('');
  }

  // タブ切替
  function switchTab(name) {
    document.getElementById('tab-add').style.display  = name === 'add'  ? 'block' : 'none';
    document.getElementById('tab-list').style.display = name === 'list' ? 'block' : 'none';
    document.getElementById('tab-maintenance').style.display = name === 'maintenance' ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tabTarget === name);
    });
    if (name === 'list') renderList();
    if (name === 'maintenance') renderMaintenance();
  }

  // モーダル
  function openModal(src) {
    if (!isSafeImageSrc(src)) return;
    document.getElementById('modal-img').src = src;
    document.getElementById('modal').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  // トースト
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // エラーダイアログ（中央・×で閉じるまで残る）
  function showError(msg) {
    const dialog = document.getElementById('error-dialog');
    const text = document.getElementById('error-dialog-text');
    if (!dialog || !text) { showToast('⚠️ ' + msg); return; }
    text.textContent = '⚠️ ' + msg;
    dialog.classList.add('show');
  }

  function hideError() {
    const dialog = document.getElementById('error-dialog');
    if (dialog) dialog.classList.remove('show');
  }

  // 初期化
  setDefaultDates();
  document.getElementById('m-date').value = todayLocalDate();
  addDistanceRow(DISTANCE_KIND_BIKE, '');
  renderDailyDistanceRows([]);
  initSyncControls();
  initRoutingControls();
  initCurrentOdoControl();
  updateAppVersionStatus();
  updateBackupHealth();
  bindEvents();
  resetMaintenanceForm();
  switchTab('add');
  retryPendingSync();
  // 写真キャッシュの読み込み＋レガシー写真のIDB移行。完了後に一覧を再描画する
  ensurePhotoStoreReady().then(renderList).catch(() => {});

  // PWA: Service Worker登録（https または localhost のみ。file:// では登録しない）
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('Service Worker登録失敗:', err);
      });
    });
  }
</script>
</body>
</html>
