      addDistanceRow(DISTANCE_KIND_BIKE, '');
    } else {
      distances.forEach(d => addDistanceRow(d.kind, d.km));
    }
    renderDailyDistanceRows(normalizeDailyDistances(
      r.dailyDistances,
      r.dateFrom || r.date || '',
      r.dateTo || r.dateFrom || r.date || '',
      distanceSumByKind(distances, DISTANCE_KIND_BIKE)
    ));
    renderCalcBasis(Array.isArray(r.calcBasis) ? r.calcBasis : []);
    document.getElementById('f-fuel').value = r.fuel || '';
    document.getElementById('f-fuel-cost').value = r.fuelCost || '';
    document.getElementById('f-memo').value = r.memo || '';

    document.getElementById('stop-list').innerHTML = '';
    normalizeStops(r.stops).forEach(s => addStop(s.name, s.memo, s.rating, s.type, s.toName, s.vehicle, s.distanceKm, s.date));
    photoData = Array.isArray(r.photos) ? r.photos.filter(isSafeImageSrc).slice(0, MAX_PHOTOS) : [];
    renderPhotoPreview();
    setMainRating(r.rating || 0);
    updateDays();
    renderDailyDistanceRows(normalizeDailyDistances(
      r.dailyDistances,
      r.dateFrom || r.date || '',
      r.dateTo || r.dateFrom || r.date || '',
      distanceSumByKind(distances, DISTANCE_KIND_BIKE)
    ), r.dailyWeather || []);
    updateFuelEff();
    document.getElementById('save-btn').textContent = '💾 変更を保存する';
    document.getElementById('cancel-edit-btn').style.display = 'block';
    switchTab('add');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast('編集できます');
  }

  function cancelEdit() {
    resetForm();
    showToast('編集をキャンセルしました');
  }

  // 一覧表示
  function renderList() {
    const q = document.getElementById('search').value.toLowerCase();
    const list = getRecords().filter(r => {
      const stops = normalizeStops(r.stops);
      return (r.title || '').toLowerCase().includes(q) ||
        (r.to || '').toLowerCase().includes(q) ||
        (r.from || '').toLowerCase().includes(q) ||
        (r.memo || '').toLowerCase().includes(q) ||
        stops.some(s =>
          (s.name || '').toLowerCase().includes(q) ||
          (s.toName || '').toLowerCase().includes(q) ||
          (s.memo || '').toLowerCase().includes(q) ||
          (s.date || '').toLowerCase().includes(q) ||
          formatDate(s.date).toLowerCase().includes(q)
        );
    });

    const all       = getRecords();
    const totalBikeKm  = all.reduce((s, r) => s + getRecordBikeKm(r), 0);
    const totalFerryKm = all.reduce((s, r) => s + distanceSumByKind(normalizeDistances(r.distances, r.km, r.stops), DISTANCE_KIND_FERRY), 0);
    const totalCost = all.reduce((s, r) => s + safeNumber(r.fuelCost), 0);
    const totalDays = all.reduce((s, r) => {
      if (!r.dateFrom) return s + 1;
      const to = r.dateTo && r.dateTo >= r.dateFrom ? r.dateTo : r.dateFrom;
      return s + Math.round((new Date(to) - new Date(r.dateFrom)) / 86400000) + 1;
    }, 0);
    document.getElementById('stat-count').textContent = all.length;
    document.getElementById('stat-km-bike').textContent  = Math.round(totalBikeKm).toLocaleString();
    document.getElementById('stat-km-bike-day').textContent = totalDays > 0 ? Math.round(totalBikeKm / totalDays).toLocaleString() : '0';
    document.getElementById('stat-km-ferry').textContent = Math.round(totalFerryKm).toLocaleString();
    document.getElementById('stat-days').textContent  = totalDays;
    document.getElementById('stat-cost').textContent  = totalCost.toLocaleString();

    const el = document.getElementById('record-list');
    if (list.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="icon">🏍️</div>記録がまだありません。<br>最初のツーリングを記録しよう！</div>`;
      return;
    }

    el.innerHTML = list.map(r => {
      const distances = normalizeDistances(r.distances, r.km, r.stops);
      const bikeKm = getRecordBikeKm(r);
      const ferryKm = distanceSumByKind(distances, DISTANCE_KIND_FERRY);
      const otherDistances = distances.filter(d => d.kind !== DISTANCE_KIND_BIKE && d.kind !== DISTANCE_KIND_FERRY);
      const fuel = safeNumber(r.fuel);
      const fuelCost = safeNumber(r.fuelCost);
      const safeRating = clampInt(r.rating, 0, 5);
      const recordId = String(r.id || '');
      const photos = Array.isArray(r.photos) ? r.photos.filter(isSafeImageSrc).slice(0, MAX_PHOTOS) : [];
      return `
      <div class="record-card">
        <div class="record-header">
          <div class="record-title">${r.title ? escape(r.title) : `📍 ${escape(r.to)}`}</div>
          <div class="record-date">${escape(formatDateRange(r))}</div>
        </div>
        <div class="route-flow">
          ${renderRouteFlow(r)}
        </div>
        ${renderStopNotes(r)}
        ${renderDailyDistances(r, bikeKm)}
        <div class="record-meta">
          ${bikeKm  ? `<span>🏍️ ${Math.round(bikeKm).toLocaleString()} km</span>` : ''}
          ${ferryKm ? `<span>⛴️ ${Math.round(ferryKm).toLocaleString()} km</span>` : ''}
          ${otherDistances.map(d => `<span>📦 ${escape(d.kind)} ${Math.round(d.km).toLocaleString()} km</span>`).join('')}
          ${fuel     ? `<span>⛽ ${fuel} L</span>` : ''}
          ${fuelCost ? `<span>💴 ${fuelCost.toLocaleString()} 円</span>` : ''}
          ${bikeKm && fuel ? `<span>⚡ ${(bikeKm / fuel).toFixed(1)} km/L</span>` : ''}
          ${(!r.dailyWeather?.length && r.weather) ? `<span>${escape(r.weather)}</span>` : ''}
        </div>
        ${safeRating ? `<div class="record-stars">${'★'.repeat(safeRating)}${'☆'.repeat(5 - safeRating)}</div>` : ''}
        ${r.memo   ? `<div class="record-memo">${escape(r.memo)}</div>` : ''}
        ${photos.length ? `
          <div class="record-photos">
            ${photos.map(p => `<img src="${escapeAttr(p)}" data-modal-src="${escapeAttr(p)}" alt="" />`).join('')}
          </div>` : ''}
        <div class="record-actions">
          <button class="btn-gmap-small" data-record-action="map" data-record-id="${escapeAttr(recordId)}">🗺️ Google Mapsで見る</button>
          <button class="btn-gmap-small" data-record-action="edit" data-record-id="${escapeAttr(recordId)}">✏️ 編集</button>
          <button class="btn-delete" data-record-action="delete" data-record-id="${escapeAttr(recordId)}">🗑️ 削除</button>
        </div>
      </div>
    `}).join('');
  }

  function routeLink(place, label, className = 'place') {
    return `<span class="${className} map-link" data-map-place="${escapeAttr(place)}">${escape(label)}</span>`;
  }

  function renderRouteFlow(r) {
    const segments = [];
    if (r.from) segments.push(routeLink(r.from, `🗺️ ${r.from}`));
    normalizeStops(r.stops).forEach(s => {
      if (s.type === 'ferry') {
        const ferry = [];
        if (s.name) ferry.push(routeLink(s.name, stopRouteLabel('⛴️', s.name, s.date), 'place ferry-place'));
        if (s.name && s.toName) ferry.push('<span class="arrow ferry-arrow">⇢</span>');
        if (s.toName) ferry.push(routeLink(s.toName, `⚓ ${s.toName}`, 'place ferry-place'));
        if (ferry.length) segments.push(`<span>${ferry.join('')}</span>`);
      } else if (s.name) {
        const icon = s.vehicle === 'ferry' ? '⛴️' : '🏍️';
        segments.push(routeLink(s.name, stopRouteLabel(icon, s.name, s.date)));
      }
    });
    if (r.to) segments.push(routeLink(r.to, `📍 ${r.to}`));
    return segments.join('<span class="arrow">▶</span>');
  }

  function renderStopNotes(r) {
    const notes = normalizeStops(r.stops).filter(s => s.memo || s.date);
    if (!notes.length) return '';
    return `
      <div style="margin-bottom:10px;">
        ${notes.map(s => {
          let title, color;
          const safeRating = clampInt(s.rating, 0, 5);
          if (s.type === 'ferry') {
            title = `⛴️ ${s.name || '乗船港未入力'}${s.toName ? ` ⇢ ${s.toName}` : ''}`;
            color = '#83d4cf';
          } else if (s.vehicle === 'ferry') {
            title = `⛴️ ${s.name}`;
            color = '#83d4cf';
          } else {
            title = `🏍️ ${s.name}`;
            color = '#e94560';
          }
          const dateLine = s.date
            ? `<div style="font-size:0.78rem;color:#aaa;margin-bottom:3px;">📅 ${escape(formatDate(s.date))}</div>`
            : '';
          const memoLine = s.memo
            ? `<div style="font-size:0.88rem;color:#ccc;white-space:pre-wrap;">${escape(s.memo)}</div>`
            : '';
          return `
            <div style="border-left:3px solid ${color};padding:6px 10px;margin-bottom:6px;background:#0f3460;border-radius:0 6px 6px 0;">
              <div style="font-size:0.8rem;color:${color};margin-bottom:3px;">${escape(title)}${safeRating ? `　<span style="color:#f5a623;">${'★'.repeat(safeRating)}${'☆'.repeat(5-safeRating)}</span>` : ''}</div>
              ${dateLine}
              ${memoLine}
            </div>`;
        }).join('')}
      </div>`;
  }

  function renderDailyDistances(r, bikeKm) {
    const daily = getRecordDailyDistances(r, bikeKm);
    if (!daily.length) return '';
    const weatherByDate = new Map((r.dailyWeather || []).map(d => [d.date, d.weather]));
    return `
      <div class="daily-distance-display">
        ${daily.map(d => {
          const w = weatherByDate.get(d.date) || '';
          return `<span class="daily-distance-pill">${w ? escape(w) + ' ' : '🏍️ '}${escape(formatShortDate(d.date))} ${Math.round(d.bikeKm).toLocaleString()} km</span>`;
        }).join('')}
      </div>`;
  }

  function stopRouteLabel(icon, name, date) {
    const dateLabel = formatShortDate(date);
    return `${icon} ${dateLabel ? `${dateLabel} ` : ''}${name}`;
  }

  function formatDate(d) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    if (!/^\d{4}$/.test(y) || !/^\d{2}$/.test(m) || !/^\d{2}$/.test(day)) return '';
    return `${y}年${m}月${day}日`;
  }
  function formatShortDate(d) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    if (!/^\d{4}$/.test(y) || !/^\d{2}$/.test(m) || !/^\d{2}$/.test(day)) return '';
    return `${Number(m)}/${Number(day)}`;
  }
  function formatDateRange(r) {
    const from = r.dateFrom || r.date;
    const to   = r.dateTo;
    if (!from) return '';
    if (!to || to === from) return formatDate(from);
    const days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;
    return `${formatDate(from)} 〜 ${formatDate(to)}（${days}日間）`;
  }
  function escapeAttr(s) {
    return escape(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escape(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function sameId(a, b) {
    return String(a) === String(b);
  }
  function safeNumber(value) {
    const num = Number(value);
    return Number.isFinite(num) && num > 0 ? num : 0;
  }
  function normalizeDistanceKm(value) {
    const num = Number(value);
    return Number.isFinite(num) && num > 0 ? num : null;
  }
  function normalizeDateValue(value) {
    const text = String(value || '').trim();
    return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : '';
  }
  function clampInt(value, min, max) {
    const num = Number.parseInt(value, 10);
    if (!Number.isFinite(num)) return min;
    return Math.min(max, Math.max(min, num));
  }
  function isSafeImageSrc(src) {
    return /^data:image\/(?:jpeg|jpg|png|gif|webp);base64,[a-z0-9+/=\s]+$/i.test(String(src || ''));
  }

  function bindEvents() {
    document.querySelectorAll('[data-tab-target]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tabTarget));
    });
    document.getElementById('f-date-from').addEventListener('input', updateDays);
    document.getElementById('f-date-to').addEventListener('input', updateDays);
    document.getElementById('f-fuel').addEventListener('input', updateFuelEff);
    document.getElementById('btn-calc').addEventListener('click', calcDistance);
    // ルート入力時の自動計算トリガー
    document.getElementById('f-from').addEventListener('input', scheduleAutoCalc);
    document.getElementById('f-to').addEventListener('input', scheduleAutoCalc);
    document.getElementById('f-date-from').addEventListener('input', scheduleAutoCalc);
    document.getElementById('f-date-to').addEventListener('input', scheduleAutoCalc);
    document.getElementById('btn-add-distance').addEventListener('click', () => addDistanceRow('', ''));
    document.getElementById('btn-gmap-route').addEventListener('click', openGMapRoute);
    document.getElementById('save-btn').addEventListener('click', saveRecord);
    document.getElementById('cancel-edit-btn').addEventListener('click', cancelEdit);
    document.getElementById('search').addEventListener('input', renderList);
    document.getElementById('btn-save-sync').addEventListener('click', saveSyncSettings);
    document.getElementById('btn-save-routing').addEventListener('click', saveRoutingSettings);
    document.getElementById('error-dialog-close').addEventListener('click', hideError);
    document.getElementById('btn-sync-now').addEventListener('click', () => syncNow());
    document.getElementById('btn-export-records').addEventListener('click', exportRecords);
    document.getElementById('btn-clear-legacy-records').addEventListener('click', clearLegacyRecords);
    document.getElementById('btn-import-records').addEventListener('click', () => {
      document.getElementById('import-records-file').click();
    });
    document.getElementById('import-records-file').addEventListener('change', e => {
      importRecordsFile(e.target.files && e.target.files[0]);
      e.target.value = '';
    });
    document.getElementById('f-photo').addEventListener('change', previewPhotos);
    document.getElementById('photo-area').addEventListener('click', () => {
      document.getElementById('f-photo').click();
    });
    document.querySelectorAll('[data-map-input]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.mapInput);
        openGMapSingle(input ? input.value : '');
      });
    });
    document.querySelectorAll('[data-add-stop]').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.dataset.addStop === 'ferry' ? addStop('', '', 0, 'ferry') : addStop();
      });
    });
    document.querySelectorAll('.star').forEach(s => {
      s.addEventListener('click', () => setMainRating(parseInt(s.dataset.v, 10)));
    });

    document.getElementById('stop-list').addEventListener('click', e => {
      const removeBtn = e.target.closest('[data-remove-stop]');
      if (removeBtn) {
        removeStop(removeBtn.dataset.removeStop);
        return;
      }
      const mapBtn = e.target.closest('[data-map-prev]');
      if (mapBtn) {
        const input = mapBtn.previousElementSibling;
        openGMapSingle(input ? input.value : '');
        return;
      }
      const star = e.target.closest('.stop-star');
      if (star) setStopRating(star);
    });
    document.getElementById('stop-list').addEventListener('change', e => {
      if (e.target.classList.contains('stop-type')) { updateStopType(e.target); scheduleAutoCalc(); }
      if (e.target.classList.contains('stop-date')) scheduleAutoCalc();
    });
    document.getElementById('stop-list').addEventListener('input', e => {
      if (e.target.classList.contains('stop-name')) scheduleAutoCalc();
    });

    document.getElementById('record-list').addEventListener('click', e => {
      const image = e.target.closest('[data-modal-src]');
      if (image) {
        openModal(image.dataset.modalSrc);
        return;
      }
      const mapPlace = e.target.closest('[data-map-place]');
      if (mapPlace) {
        openGMapSingle(mapPlace.dataset.mapPlace);
        return;
      }
      const actionBtn = e.target.closest('[data-record-action]');
      if (!actionBtn) return;
      const id = actionBtn.dataset.recordId;
      if (actionBtn.dataset.recordAction === 'map') openGMapRecord(id);
      if (actionBtn.dataset.recordAction === 'edit') editRecord(id);
      if (actionBtn.dataset.recordAction === 'delete') deleteRecord(id);
    });
    document.getElementById('modal').addEventListener('click', closeModal);
  }

  // 削除
  function deleteRecord(id) {
    if (!confirm('この記録を削除しますか？')) return;
    rememberDeletedRecord(id);
    const list = getRecords().filter(r => !sameId(r.id, id));
    saveRecords(list);
    renderList();
    queueAutoSync();
    showToast('🗑️ 削除しました');
  }

  // タブ切替
  function switchTab(name) {
    document.getElementById('tab-add').style.display  = name === 'add'  ? 'block' : 'none';
    document.getElementById('tab-list').style.display = name === 'list' ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && name === 'add') || (i === 1 && name === 'list'));
    });
    if (name === 'list') renderList();
  }

  // モーダル
  function openModal(src) {
    if (!isSafeImageSrc(src)) return;
    document.getElementById('modal-img').src = src;
    document.getElementById('modal').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  // トースト
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // エラーダイアログ（中央・×で閉じるまで残る）
  function showError(msg) {
    const dialog = document.getElementById('error-dialog');
    const text = document.getElementById('error-dialog-text');
    if (!dialog || !text) { showToast('⚠️ ' + msg); return; }
    text.textContent = '⚠️ ' + msg;
    dialog.classList.add('show');
  }

  function hideError() {
    const dialog = document.getElementById('error-dialog');
    if (dialog) dialog.classList.remove('show');
  }

  // 初期化
  setDefaultDates();
  addDistanceRow(DISTANCE_KIND_BIKE, '');
  renderDailyDistanceRows([]);
  initSyncControls();
  initRoutingControls();
  bindEvents();
  switchTab('add');
</script>
</body>
</html>
