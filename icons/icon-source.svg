<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0445c"/>
      <stop offset="0.5" stop-color="#6a3370"/>
      <stop offset="1" stop-color="#1f2f6e"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7ae8"/>
      <stop offset="0.45" stop-color="#2148b0"/>
      <stop offset="1" stop-color="#122a78"/>
    </linearGradient>
    <linearGradient id="cowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a64d4"/>
      <stop offset="1" stop-color="#122a78"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ecf2"/>
      <stop offset="0.5" stop-color="#aab2c0"/>
      <stop offset="1" stop-color="#7c8494"/>
    </linearGradient>
  </defs>

  <!-- 背景（フルブリード・maskable対応） -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 後輪 -->
  <g>
    <circle cx="155" cy="330" r="62" fill="#16161c"/>
    <circle cx="155" cy="330" r="42" fill="none" stroke="#8a8e9a" stroke-width="4"/>
    <circle cx="155" cy="330" r="38" fill="#23232b"/>
    <g stroke="#4a4e5a" stroke-width="5">
      <line x1="155" y1="296" x2="155" y2="364"/>
      <line x1="125.6" y1="313" x2="184.4" y2="347"/>
      <line x1="125.6" y1="347" x2="184.4" y2="313"/>
    </g>
    <circle cx="155" cy="330" r="10" fill="#9aa0ac"/>
  </g>

  <!-- スイングアーム -->
  <line x1="155" y1="330" x2="225" y2="300" stroke="#3a3a44" stroke-width="11" stroke-linecap="round"/>

  <!-- 前輪 -->
  <g>
    <circle cx="375" cy="330" r="62" fill="#16161c"/>
    <circle cx="375" cy="330" r="42" fill="none" stroke="#8a8e9a" stroke-width="4"/>
    <circle cx="375" cy="330" r="38" fill="#23232b"/>
    <g stroke="#4a4e5a" stroke-width="5">
      <line x1="375" y1="296" x2="375" y2="364"/>
      <line x1="345.6" y1="313" x2="404.4" y2="347"/>
      <line x1="345.6" y1="347" x2="404.4" y2="313"/>
    </g>
    <circle cx="375" cy="330" r="10" fill="#9aa0ac"/>
  </g>

  <!-- フロントフォーク -->
  <line x1="344" y1="200" x2="372" y2="326" stroke="#c4c8d2" stroke-width="9" stroke-linecap="round"/>
  <line x1="334" y1="202" x2="362" y2="328" stroke="#6e7480" stroke-width="9" stroke-linecap="round"/>

  <!-- フロントフェンダー（クローム・タイヤに沿わせる） -->
  <path d="M 327 297 A 60 60 0 0 1 434 318" fill="none" stroke="url(#chrome)" stroke-width="11" stroke-linecap="round"/>

  <!-- フレームダウンチューブ -->
  <line x1="332" y1="208" x2="262" y2="252" stroke="#2c2c34" stroke-width="9" stroke-linecap="round"/>

  <!-- エキゾースト（4-1 メガホン） -->
  <path d="M 268 250 C 246 258 234 286 240 312 L 268 322 L 348 314 C 352 313 352 305 348 304 L 270 306 C 258 290 262 266 276 258 Z" fill="url(#chrome)" stroke="#5a606c" stroke-width="2"/>

  <!-- エンジン -->
  <g>
    <rect x="206" y="238" width="96" height="64" rx="12" fill="#23232b"/>
    <rect x="214" y="244" width="80" height="6" rx="3" fill="#3c3c46"/>
    <rect x="214" y="254" width="80" height="6" rx="3" fill="#3c3c46"/>
    <rect x="214" y="264" width="80" height="6" rx="3" fill="#3c3c46"/>
    <circle cx="282" cy="288" r="15" fill="#8e94a2"/>
    <circle cx="282" cy="288" r="8" fill="#b8bec8"/>
    <circle cx="232" cy="290" r="11" fill="#6e7480"/>
  </g>

  <!-- ダックテールカウル（シートと一体の流れ） -->
  <path d="M 148 230 L 102 222 C 93 221 89 229 92 236 L 99 253 C 101 257 105 259 110 259 L 150 257 Z" fill="url(#cowl)"/>
  <path d="M 96 236 L 150 239 L 150 248 L 100 247 Z" fill="#8fb4e0" stroke="#f0f4ff" stroke-width="2"/>
  <circle cx="96" cy="241" r="4.5" fill="#e84450"/>

  <!-- シート -->
  <path d="M 148 228 C 172 222 200 224 216 230 L 214 252 C 188 250 162 252 150 257 Z" fill="#1a1a20"/>

  <!-- サイドカバー -->
  <path d="M 210 244 L 244 247 L 236 282 C 222 280 212 268 208 256 Z" fill="#1f1f27"/>

  <!-- タンク（キャンディトーンブルー・大きめティアドロップ） -->
  <path d="M 196 202 C 234 186 300 182 332 192 C 344 196 348 206 345 217 C 340 238 320 246 298 246 C 264 246 226 242 206 241 C 194 239 190 210 196 202 Z" fill="url(#tank)"/>
  <!-- タンク上面ハイライト -->
  <path d="M 210 200 C 244 189 298 187 324 194 C 314 197 248 199 218 205 Z" fill="#6f96ee" opacity="0.75"/>
  <!-- ストライプ（ライトブルー＋白ピンスト） -->
  <path d="M 197 221 C 240 226 300 230 343 222 L 340 233 C 300 240 238 235 199 230 Z" fill="#8fb4e0" stroke="#f0f4ff" stroke-width="2"/>

  <!-- ヘッドライト（丸目） -->
  <circle cx="356" cy="208" r="23" fill="#d8dce4"/>
  <circle cx="356" cy="208" r="18" fill="#f2ecd2"/>
  <path d="M 346 200 A 13 13 0 0 1 362 196" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- ハンドル・ミラー -->
  <line x1="342" y1="196" x2="326" y2="172" stroke="#23232b" stroke-width="6" stroke-linecap="round"/>
  <line x1="326" y1="172" x2="334" y2="156" stroke="#3c3c46" stroke-width="3"/>
  <circle cx="336" cy="151" r="7" fill="#c4c8d2"/>
</svg>
