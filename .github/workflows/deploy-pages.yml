name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CSP script hash matches inline script
        run: |
          python3 - <<'PY'
          import re, hashlib, base64, sys
          html = open('index.html', 'rb').read()
          body = re.search(rb'(?<=<script>)(.*?)(?=</script>)', html, re.DOTALL).group(1)
          calc = base64.b64encode(hashlib.sha256(body).digest()).decode()
          meta = re.search(rb"sha256-([A-Za-z0-9+/=]+)", html).group(1).decode()
          ok = True
          if meta != calc:
              print(f"::error::index.html CSP hash mismatch: meta={meta} body={calc}")
              ok = False
          for f in ('vercel.json', 'netlify.toml'):
              try:
                  m = re.search(rb"sha256-([A-Za-z0-9+/=]+)", open(f, 'rb').read()).group(1).decode()
              except FileNotFoundError:
                  continue
              if m != calc:
                  print(f"::error::{f} CSP hash mismatch: {m} != {calc}")
                  ok = False
          if not ok:
              sys.exit("CSP hash inconsistent. Re-sync index.html / vercel.json / netlify.toml before deploy.")
          print(f"CSP hash OK: {calc}")
          PY

      - name: Prepare static files
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp manifest.webmanifest public/manifest.webmanifest
          cp sw.js public/sw.js
          cp -R icons public/icons
          cp hokkaido-planC.html hokkaido-route.html team-org.html fighter.html vf6.html public/
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        # Deployステップだけの一時エラーが繰り返し起きているため、失敗時は1回だけ自動再試行する
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        # 即時リトライでは同じ一時エラーを引くことがあるため間隔を空ける
        run: sleep 30

      - name: Deploy (retry after transient error)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
